name: CI - Testes de API

on:
  push:
    branches:
      - main
      - feature/automatiza-testes-gestao-alunos
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Executar testes automatizados
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
      BASE_URL: http://127.0.0.1:3000
      ADMIN_EMAIL: admin@escola.com
      ADMIN_PASSWORD: admin123

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          npm start > /tmp/gestao-de-alunos-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE_URL/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gestao-de-alunos-api.log
          exit 1

      - name: Executar testes automatizados
        run: npm test